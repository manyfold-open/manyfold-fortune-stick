# Checks only — this workflow never deploys and stores no Cloudflare credentials.
# Nothing deploys on a push: this repo is not connected to Workers Builds, so shipping
# is a deliberate `npm run deploy` from a machine that is logged in to Cloudflare.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
