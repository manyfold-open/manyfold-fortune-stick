<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="530" height="1045" viewBox="0 -10 530 1045" role="img" aria-labelledby="title description">
  <title id="title">Kawaii omikuji fortune-stick container</title>
  <desc id="description">A cream Japanese fortune-stick container with five illustrated fortune sticks, red plum blossoms, a bow, and a cute bear holding a flower.</desc>
  <defs>
    <linearGradient id="pot" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f4dfbd"/>
      <stop offset="0.12" stop-color="#fff5dc"/>
      <stop offset="0.48" stop-color="#fff8e7"/>
      <stop offset="0.82" stop-color="#f8e8cb"/>
      <stop offset="1" stop-color="#dfb887"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e6c69d"/>
      <stop offset="0.12" stop-color="#fff8e7"/>
      <stop offset="0.5" stop-color="#fffdf1"/>
      <stop offset="0.88" stop-color="#f7e8ce"/>
      <stop offset="1" stop-color="#dcb488"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#eed7b4"/>
      <stop offset="0.18" stop-color="#fff6e2"/>
      <stop offset="0.55" stop-color="#fff9e8"/>
      <stop offset="1" stop-color="#ecd4ae"/>
    </linearGradient>
    <linearGradient id="medallion" x1="0" x2="0.8" y1="0" y2="1">
      <stop offset="0" stop-color="#fff9e7"/>
      <stop offset="0.7" stop-color="#f7e6c6"/>
      <stop offset="1" stop-color="#e8c79e"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="0.8" y1="0" y2="1">
      <stop offset="0" stop-color="#f1745c"/>
      <stop offset="1" stop-color="#cf4537"/>
    </linearGradient>
    <style>
