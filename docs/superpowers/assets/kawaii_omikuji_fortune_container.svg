        <ellipse cx="5.3" cy="7.3" rx="7" ry="10" transform="rotate(144 5.3 7.3)"/>
        <ellipse cx="-5.3" cy="7.3" rx="7" ry="10" transform="rotate(216 -5.3 7.3)"/>
